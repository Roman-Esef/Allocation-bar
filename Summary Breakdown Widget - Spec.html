  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"ru\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Summary Breakdown Widget — Design Specification<\u002Ftitle>\n<style>/* ============================================================\n   SummaryBreakdown — component styles\n   Container Queries drive all adaptive behaviour.\n   The host element MUST have container-type: inline-size.\n   ============================================================ */\n\n.sbw-host {\n  container-type: inline-size;\n  container-name: sbw;\n  font-family: var(--sbw-font, \"Helvetica Neue\", Helvetica, Arial, sans-serif);\n  color: var(--sbw-fg, #1B1D24);\n  font-feature-settings: \"tnum\" 1, \"lnum\" 1;\n}\n\n.sbw {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  max-width: var(--sbw-max-width, 600px);\n}\n\n/* ----- header ----- */\n.sbw-header {\n  display: flex;\n  align-items: baseline;\n  gap: 16px;\n  justify-content: space-between;\n}\n.sbw-header-left {\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n  min-width: 0;\n  flex: 1 1 auto;\n}\n.sbw-label {\n  font-size: 13px;\n  line-height: 1.35;\n  color: var(--sbw-fg-muted, #54596A);\n  font-weight: 400;\n  letter-spacing: 0.01em;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.sbw-sublabel {\n  font-size: 11px;\n  color: var(--sbw-fg-faint, #8A8F9E);\n  line-height: 1.3;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.sbw-total {\n  font-size: 18px;\n  font-weight: 700;\n  letter-spacing: -0.01em;\n  white-space: nowrap;\n  flex: 0 0 auto;\n}\n.sbw-total .sbw-unit {\n  font-weight: 400;\n  font-size: 12px;\n  color: var(--sbw-fg-faint, #8A8F9E);\n  margin-left: 2px;\n}\n.sbw-total-empty { color: var(--sbw-fg-faint, #8A8F9E); font-weight: 400; }\n\n/* ----- bar ----- */\n.sbw-bar {\n  display: flex;\n  height: 8px;\n  flex: 0 0 8px;\n  min-height: 8px;\n  max-height: 8px;\n  border-radius: 999px;\n  overflow: hidden;\n  gap: 2px;\n  background: var(--sbw-track, #EFF1F5);\n  isolation: isolate;\n}\n.sbw-seg {\n  height: 100%;\n  flex: 0 0 0;\n  min-width: 2px;\n  transition: filter .15s ease, opacity .15s ease;\n}\n.sbw-seg-rest {\n  background: var(--sbw-track, #EFF1F5) !important;\n}\n\n/* ----- list ----- */\n.sbw-list {\n  display: flex;\n  flex-direction: column;\n}\n.sbw-row {\n  display: grid;\n  grid-template-columns: 14px 1fr auto auto;\n  align-items: center;\n  gap: 10px;\n  padding: 2px 0;\n  font-size: 14px;\n  line-height: 1.4;\n  min-height: 24px;\n}\n.sbw-row + .sbw-row {\n  border-top: 1px solid var(--sbw-divider, transparent);\n}\n.sbw-dot {\n  width: 8px;\n  height: 8px;\n  border-radius: 50%;\n  display: inline-block;\n  justify-self: center;\n}\n.sbw-row-label {\n  min-width: 0;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  color: var(--sbw-fg, #1B1D24);\n}\n.sbw-row-percent {\n  font-variant-numeric: tabular-nums;\n  color: var(--sbw-fg-muted, #54596A);\n  text-align: right;\n  min-width: 64px;\n}\n.sbw-row-value {\n  font-variant-numeric: tabular-nums;\n  text-align: right;\n  min-width: 72px;\n  color: var(--sbw-fg, #1B1D24);\n}\n\n/* hover bar↔list link — bidirectional via JS-set data-hover-id + .sbw-hover-active */\n.sbw[data-hover-id] .sbw-seg { opacity: 0.3; }\n.sbw[data-hover-id] .sbw-row { opacity: 0.55; }\n.sbw[data-hover-id] .sbw-seg.sbw-hover-active,\n.sbw[data-hover-id] .sbw-row.sbw-hover-active { opacity: 1; }\n.sbw-row:hover { background: var(--sbw-row-hover, rgba(0,0,0,0.03)); border-radius: 4px; }\n\n/* show-more */\n.sbw-more {\n  align-self: flex-start;\n  margin-top: 6px;\n  background: none;\n  border: 0;\n  padding: 6px 0;\n  font: inherit;\n  font-size: 13px;\n  color: var(--sbw-accent, #5853D9);\n  cursor: pointer;\n}\n.sbw-more:hover { text-decoration: underline; }\n\n/* ============================================================\n   Alert plates — shared style.\n   Used for footer flags (partial/overflow), error, empty, loading.\n   Pastel background, no border, colored icon, dark text, action below.\n   ============================================================ */\n.sbw-foot {\n  display: flex;\n  align-items: flex-start;\n  gap: 10px;\n  font-size: 13px;\n  margin-top: 4px;\n  padding: 12px 14px;\n  border-radius: 8px;\n  line-height: 1.4;\n  color: #1B1D24;\n}\n.sbw-foot svg { flex: 0 0 auto; margin-top: 1px; }\n.sbw-foot strong { font-weight: 600; }\n/* partial — warning (yellow) */\n.sbw-foot-muted {\n  background: #FCF3D6;\n}\n.sbw-foot-muted svg { color: #E0A800; }\n/* overflow — error (red) */\n.sbw-foot-warn  {\n  background: #FBE0DD;\n}\n.sbw-foot-warn svg { color: #D74333; }\n\n/* ----- skeleton (loading) ----- */\n.sbw-sk {\n  background: linear-gradient(90deg, #ECEEF3 0%, #F5F6F9 50%, #ECEEF3 100%);\n  background-size: 200% 100%;\n  border-radius: 4px;\n  animation: sbw-shimmer 1.4s linear infinite;\n}\n@keyframes sbw-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }\n.sbw-sk-total { width: 56px; height: 18px; }\n.sbw-sk-bar   { height: 8px; border-radius: 999px; }\n.sbw-row-sk   { pointer-events: none; }\n.sbw-dot-sk   { background: #DCDFE6 !important; }\n.sbw-sk-text  { height: 12px; width: 60%; }\n.sbw-sk-num   { height: 12px; width: 72px; justify-self: end; }\n.sbw-row-sk   { grid-template-columns: 14px 1fr auto; }\n\n.sbw-loading-msg {\n  background: #E3F0FA;\n  border-radius: 8px;\n  padding: 14px 16px;\n  display: flex;\n  align-items: flex-start;\n  gap: 10px;\n  color: #1B1D24;\n}\n.sbw-loading-msg::before {\n  content: \"\";\n  width: 16px;\n  height: 16px;\n  border-radius: 50%;\n  background: #2978B5;\n  flex: 0 0 auto;\n  margin-top: 1px;\n  background-image: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='5' r='1' fill='white'/><rect x='7.2' y='7' width='1.6' height='5' rx='0.6' fill='white'/><\u002Fsvg>\");\n  background-size: cover;\n}\n.sbw-loading-text { flex: 1; min-width: 0; }\n.sbw-loading-title { font-size: 13px; font-weight: 600; color: #1B1D24; margin-bottom: 2px; }\n.sbw-loading-sub   { font-size: 12px; color: #54596A; }\n\n/* ----- error ----- */\n.sbw-error {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  padding: 14px 16px;\n  background: #FBE0DD;\n  border-radius: 8px;\n  color: #1B1D24;\n}\n.sbw-error-top {\n  display: flex;\n  align-items: flex-start;\n  gap: 10px;\n}\n.sbw-error svg { color: #D74333; flex: 0 0 auto; margin-top: 1px; }\n.sbw-error-text { flex: 1; min-width: 0; }\n.sbw-error-title { font-size: 13px; font-weight: 600; color: #1B1D24; }\n.sbw-error-sub   { font-size: 12px; color: #54596A; margin-top: 2px; }\n.sbw-error-btn {\n  background: #fff;\n  border: 1px solid rgba(0,0,0,0.08);\n  color: #1B1D24;\n  border-radius: 6px;\n  padding: 6px 14px;\n  font: inherit;\n  font-size: 12px;\n  cursor: pointer;\n  align-self: flex-start;\n  margin-left: 26px; /* align under text, past icon */\n}\n.sbw-error-btn:hover { background: #F5F6F9; }\n\n/* ----- empty ----- */\n.sbw-empty {\n  display: flex;\n  align-items: flex-start;\n  gap: 10px;\n  padding: 14px 16px;\n  background: #E3F0FA;\n  border-radius: 8px;\n  color: #1B1D24;\n  font-size: 13px;\n}\n.sbw-empty-icon {\n  width: 16px; height: 16px;\n  border-radius: 50%;\n  background: #2978B5;\n  color: #fff;\n  display: grid; place-items: center;\n  font-size: 10px;\n  font-weight: 700;\n  flex: 0 0 auto;\n  margin-top: 1px;\n  font-family: ui-monospace, monospace;\n}\n\n/* ============================================================\n   CONTAINER QUERIES — the heart of adaptive behaviour\n   Breakpoints expressed in container width (inline-size).\n   ============================================================ */\n\n/* Medium 320–480px: compact */\n@container sbw (max-width: 480px) {\n  .sbw-total { font-size: 16px; }\n  .sbw-row { font-size: 13px; gap: 8px; }\n  .sbw-row-percent { min-width: 56px; }\n  .sbw-row-value   { min-width: 64px; }\n}\n\n/* Narrow <320px: hide percent column, two-line rows */\n@container sbw (max-width: 320px) {\n  .sbw-row {\n    grid-template-columns: 14px 1fr auto;\n    grid-template-rows: auto auto;\n    row-gap: 2px;\n    padding: 8px 0;\n  }\n  .sbw-row-label { grid-column: 2 / 4; }\n  .sbw-row-percent { display: none; }\n  .sbw-row-value {\n    grid-column: 2 / 4;\n    text-align: left;\n    font-size: 12px;\n    color: var(--sbw-fg-muted, #54596A);\n    min-width: 0;\n  }\n  .sbw-total { font-size: 15px; }\n  .sbw-label { font-size: 12px; }\n}\n\n/* Very narrow <200px: collapse details, only total + label visible */\n@container sbw (max-width: 200px) {\n  .sbw-list, .sbw-bar { display: none; }\n  .sbw-header { flex-direction: column; align-items: stretch; gap: 4px; }\n  .sbw-total { font-size: 22px; }\n  .sbw-host::after {\n    content: \"Развернуть\";\n    font-size: 12px;\n    color: var(--sbw-accent, #5853D9);\n    cursor: pointer;\n    margin-top: 4px;\n    display: inline-block;\n  }\n}\n\n/* Degraded <160px: only total + label, with popup affordance */\n@container sbw (max-width: 160px) {\n  .sbw-label { font-size: 11px; }\n  .sbw-sublabel { display: none; }\n  .sbw-total { font-size: 18px; }\n  .sbw-host::after { content: \"↗\"; font-size: 14px; }\n}\n\n/* ============================================================\n   Height-constrained variant (manually toggled via data-height)\n   ============================================================ */\n\n.sbw-host[data-height=\"A\"] .sbw,\n.sbw-host[data-height=\"B\"] .sbw,\n.sbw-host[data-height=\"C\"] .sbw {\n  position: relative;\n  overflow: hidden;\n}\n\n/* A: fade + \"ещё N\" */\n.sbw-host[data-height=\"A\"] {\n  height: 140px;\n  position: relative;\n}\n.sbw-host[data-height=\"A\"] .sbw { height: 100%; }\n.sbw-host[data-height=\"A\"] .sbw-list {\n  overflow: hidden;\n  mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);\n  -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);\n}\n.sbw-host[data-height=\"A\"] .sbw-fade-cta {\n  position: absolute;\n  bottom: 4px;\n  left: 0;\n  font-size: 12px;\n  color: var(--sbw-accent, #5853D9);\n  cursor: pointer;\n}\n\n/* B: only header + bar */\n.sbw-host[data-height=\"B\"] {\n  height: 70px;\n}\n.sbw-host[data-height=\"B\"] .sbw-list { display: none; }\n\n/* C: only header */\n.sbw-host[data-height=\"C\"] {\n  height: 48px;\n}\n.sbw-host[data-height=\"C\"] .sbw-list,\n.sbw-host[data-height=\"C\"] .sbw-bar { display: none; }\n\n/* dark theme variables — toggle via .sbw-dark wrapper */\n.sbw-dark {\n  --sbw-fg: #E8EAF0;\n  --sbw-fg-muted: #A0A6B5;\n  --sbw-fg-faint: #6E7484;\n  --sbw-track: #2A2D38;\n  --sbw-soft: #232631;\n  --sbw-row-hover: rgba(255,255,255,0.04);\n  --sbw-divider: rgba(255,255,255,0.06);\n  --sbw-accent: #9C97FF;\n}\n\n/* ============================================================\n   Stretch mode — bar + header span full container width,\n   but row content stays bounded so labels and values stay close.\n   Toggle with class .sbw-stretch on the host.\n   ============================================================ */\n.sbw-host.sbw-stretch .sbw { max-width: none; }\n.sbw-host.sbw-stretch .sbw-row,\n.sbw-host.sbw-stretch .sbw-foot {\n  /* hover bg / footer plate fills whole width; inner content is pushed\n     into a virtual 600px window from the left via padding-right */\n  padding-right: max(0px, calc(100% - 600px));\n}\n.sbw-host.sbw-stretch .sbw-foot { padding-right: max(12px, calc(100% - 600px)); }\n\n/* print: bar → text table */\n@media print {\n  .sbw-bar { display: none !important; }\n  .sbw-row { break-inside: avoid; }\n  .sbw-more { display: none !important; }\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Documentation page styles — Storybook / ZeroHeight inspired\n   Light surface, clear hierarchy, mono labels for tokens.\n   ============================================================ */\n\n:root {\n  --doc-bg: #F7F8FB;\n  --doc-surface: #FFFFFF;\n  --doc-surface-2: #F1F3F7;\n  --doc-border: #E4E7EE;\n  --doc-border-strong: #D4D8E0;\n  --doc-fg: #1B1D24;\n  --doc-fg-muted: #54596A;\n  --doc-fg-faint: #8A8F9E;\n  --doc-accent: #5853D9;\n  --doc-accent-soft: #EEEDFB;\n  --doc-warn: #B0473C;\n  --doc-warn-soft: #FBF1EF;\n  --doc-ok: #2F8A5E;\n  --doc-ok-soft: #E8F4ED;\n  --doc-mono: ui-monospace, \"SF Mono\", \"JetBrains Mono\", Menlo, Consolas, monospace;\n  --doc-sans: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  background: var(--doc-bg);\n  color: var(--doc-fg);\n  font-family: var(--doc-sans);\n  font-size: 14px;\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ====== layout ====== */\n.doc-shell {\n  display: grid;\n  grid-template-columns: 260px minmax(0, 1fr);\n  min-height: 100vh;\n}\n\n.doc-nav {\n  position: sticky;\n  top: 0;\n  align-self: start;\n  height: 100vh;\n  overflow-y: auto;\n  background: var(--doc-surface);\n  border-right: 1px solid var(--doc-border);\n  padding: 28px 22px;\n}\n.doc-nav-brand {\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--doc-fg-faint);\n  margin-bottom: 4px;\n  font-family: var(--doc-mono);\n}\n.doc-nav-title {\n  font-size: 16px;\n  font-weight: 600;\n  margin-bottom: 24px;\n  color: var(--doc-fg);\n}\n.doc-nav ol { list-style: none; padding: 0; margin: 0; }\n.doc-nav li { margin: 2px 0; }\n.doc-nav a {\n  display: block;\n  padding: 6px 10px;\n  border-radius: 6px;\n  font-size: 13px;\n  color: var(--doc-fg-muted);\n  text-decoration: none;\n  transition: background .12s ease, color .12s ease;\n}\n.doc-nav a:hover { background: var(--doc-surface-2); color: var(--doc-fg); }\n.doc-nav a.active { background: var(--doc-accent-soft); color: var(--doc-accent); }\n.doc-nav .doc-nav-sub { padding-left: 18px; }\n.doc-nav .doc-nav-sub a { font-size: 12px; padding: 4px 10px; color: var(--doc-fg-faint); }\n\n.doc-main {\n  padding: 56px 64px 120px;\n  max-width: 1180px;\n}\n\n/* ====== typography ====== */\n.doc-eyebrow {\n  font-family: var(--doc-mono);\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--doc-fg-faint);\n  margin-bottom: 8px;\n}\n.doc-h1 {\n  font-size: 36px;\n  font-weight: 700;\n  letter-spacing: -0.02em;\n  margin: 0 0 12px;\n  line-height: 1.15;\n}\n.doc-lead {\n  font-size: 16px;\n  color: var(--doc-fg-muted);\n  max-width: 720px;\n  margin: 0 0 32px;\n  line-height: 1.55;\n}\n.doc-h2 {\n  font-size: 22px;\n  font-weight: 700;\n  letter-spacing: -0.01em;\n  margin: 64px 0 4px;\n  scroll-margin-top: 16px;\n}\n.doc-h2 .doc-h2-num {\n  font-family: var(--doc-mono);\n  font-size: 13px;\n  color: var(--doc-fg-faint);\n  font-weight: 500;\n  margin-right: 10px;\n  letter-spacing: 0;\n}\n.doc-h3 {\n  font-size: 16px;\n  font-weight: 600;\n  margin: 32px 0 8px;\n  scroll-margin-top: 16px;\n}\n.doc-h3 .doc-h3-num {\n  font-family: var(--doc-mono);\n  font-size: 12px;\n  color: var(--doc-fg-faint);\n  font-weight: 500;\n  margin-right: 8px;\n}\n.doc-h4 { font-size: 13px; font-weight: 600; margin: 20px 0 6px; color: var(--doc-fg); }\n.doc-p { color: var(--doc-fg-muted); margin: 0 0 12px; max-width: 760px; }\n.doc-p strong { color: var(--doc-fg); font-weight: 600; }\n\ncode, .doc-mono { font-family: var(--doc-mono); }\n.doc-inline-code {\n  font-family: var(--doc-mono);\n  font-size: 12px;\n  background: var(--doc-surface-2);\n  border: 1px solid var(--doc-border);\n  padding: 1px 6px;\n  border-radius: 4px;\n  color: var(--doc-fg);\n}\n\n/* divider after each section */\n.doc-rule {\n  border: 0;\n  border-top: 1px solid var(--doc-border);\n  margin: 64px 0 0;\n}\n\n/* ====== cards ====== */\n.doc-card {\n  background: var(--doc-surface);\n  border: 1px solid var(--doc-border);\n  border-radius: 12px;\n  padding: 24px;\n  margin: 16px 0;\n}\n.doc-card-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n  margin-bottom: 16px;\n  gap: 12px;\n  flex-wrap: wrap;\n}\n.doc-card-title {\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--doc-fg);\n}\n.doc-card-meta {\n  font-family: var(--doc-mono);\n  font-size: 11px;\n  color: var(--doc-fg-faint);\n}\n.doc-card-note {\n  margin-top: 14px;\n  font-size: 12px;\n  color: var(--doc-fg-muted);\n  border-top: 1px dashed var(--doc-border);\n  padding-top: 12px;\n}\n\n/* grid of examples */\n.doc-grid {\n  display: grid;\n  gap: 16px;\n}\n.doc-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n.doc-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n.doc-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n@media (max-width: 1100px) {\n  .doc-grid-3, .doc-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n}\n@media (max-width: 720px) {\n  .doc-grid-2, .doc-grid-3, .doc-grid-4 { grid-template-columns: 1fr; }\n  .doc-shell { grid-template-columns: 1fr; }\n  .doc-nav { position: relative; height: auto; border-right: 0; border-bottom: 1px solid var(--doc-border); }\n  .doc-main { padding: 32px 24px 80px; }\n}\n\n/* ====== tables ====== */\n.doc-table-wrap {\n  border: 1px solid var(--doc-border);\n  border-radius: 12px;\n  overflow: hidden;\n  background: var(--doc-surface);\n  margin: 16px 0 24px;\n}\n.doc-table {\n  width: 100%;\n  border-collapse: collapse;\n  font-size: 13px;\n}\n.doc-table th, .doc-table td {\n  text-align: left;\n  padding: 12px 16px;\n  border-bottom: 1px solid var(--doc-border);\n  vertical-align: top;\n}\n.doc-table th {\n  background: var(--doc-surface-2);\n  font-weight: 600;\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  color: var(--doc-fg-faint);\n}\n.doc-table tr:last-child td { border-bottom: 0; }\n.doc-table code { font-size: 12px; color: var(--doc-accent); }\n.doc-table .req {\n  display: inline-block;\n  background: var(--doc-warn-soft);\n  color: var(--doc-warn);\n  padding: 1px 6px;\n  border-radius: 3px;\n  font-family: var(--doc-mono);\n  font-size: 10px;\n  text-transform: uppercase;\n}\n.doc-table .opt {\n  display: inline-block;\n  background: var(--doc-surface-2);\n  color: var(--doc-fg-faint);\n  padding: 1px 6px;\n  border-radius: 3px;\n  font-family: var(--doc-mono);\n  font-size: 10px;\n  text-transform: uppercase;\n}\n\n/* ====== callouts ====== */\n.doc-callout {\n  border-radius: 10px;\n  padding: 14px 16px;\n  font-size: 13px;\n  margin: 12px 0;\n  display: grid;\n  grid-template-columns: 18px 1fr;\n  gap: 10px;\n  align-items: start;\n}\n.doc-callout-info  { background: var(--doc-accent-soft); color: var(--doc-accent); }\n.doc-callout-warn  { background: var(--doc-warn-soft);   color: var(--doc-warn);   }\n.doc-callout-ok    { background: var(--doc-ok-soft);     color: var(--doc-ok);     }\n.doc-callout-icon  { font-weight: 700; font-family: var(--doc-mono); }\n.doc-callout strong { color: inherit; }\n\n/* ====== code blocks ====== */\n.doc-pre {\n  margin: 12px 0;\n  padding: 16px 18px;\n  background: #15171E;\n  color: #E8EAF0;\n  font-family: var(--doc-mono);\n  font-size: 12.5px;\n  line-height: 1.6;\n  border-radius: 10px;\n  overflow: auto;\n}\n.doc-pre .tk-key { color: #B8B5F7; }\n.doc-pre .tk-str { color: #A8D29A; }\n.doc-pre .tk-num { color: #F5C46B; }\n.doc-pre .tk-com { color: #6E7484; font-style: italic; }\n\n/* ====== anatomy svg ====== */\n.doc-anatomy {\n  background: var(--doc-surface);\n  border: 1px solid var(--doc-border);\n  border-radius: 12px;\n  padding: 32px;\n  margin: 16px 0;\n}\n.doc-anatomy svg { display: block; max-width: 100%; height: auto; }\n\n/* ====== container preview boxes ====== */\n.doc-container-box {\n  background: var(--doc-surface);\n  border: 1px dashed var(--doc-border-strong);\n  border-radius: 10px;\n  padding: 16px;\n  position: relative;\n  margin-top: 8px;\n}\n.doc-container-tag {\n  position: absolute;\n  top: -10px;\n  left: 14px;\n  background: var(--doc-bg);\n  padding: 0 8px;\n  font-family: var(--doc-mono);\n  font-size: 10px;\n  color: var(--doc-fg-faint);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n}\n\n/* ====== palette ====== */\n.doc-palette {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: 12px;\n}\n@media (max-width: 720px) { .doc-palette { grid-template-columns: repeat(2, 1fr); } }\n.doc-swatch {\n  background: var(--doc-surface);\n  border: 1px solid var(--doc-border);\n  border-radius: 10px;\n  overflow: hidden;\n}\n.doc-swatch-color { height: 64px; }\n.doc-swatch-meta { padding: 10px 12px; }\n.doc-swatch-name { font-size: 12px; font-weight: 600; }\n.doc-swatch-hex { font-family: var(--doc-mono); font-size: 11px; color: var(--doc-fg-faint); }\n.doc-swatch-num {\n  font-family: var(--doc-mono);\n  font-size: 10px;\n  color: var(--doc-fg-faint);\n  letter-spacing: 0.06em;\n}\n\n/* ====== sidebar/modal/table demo containers ====== */\n.demo-sidebar {\n  width: 240px;\n  background: var(--doc-surface);\n  border: 1px solid var(--doc-border);\n  border-radius: 10px;\n  padding: 20px;\n}\n.demo-modal {\n  background: var(--doc-surface);\n  border: 1px solid var(--doc-border);\n  border-radius: 12px;\n  box-shadow: 0 20px 50px -20px rgba(20, 24, 40, 0.18);\n  padding: 24px;\n  position: relative;\n}\n.demo-modal-bar {\n  display: flex;\n  gap: 6px;\n  margin-bottom: 18px;\n}\n.demo-modal-bar span {\n  width: 10px; height: 10px; border-radius: 50%;\n  background: var(--doc-surface-2);\n}\n.demo-table {\n  width: 100%;\n  border-collapse: collapse;\n  font-size: 13px;\n  background: var(--doc-surface);\n  border: 1px solid var(--doc-border);\n  border-radius: 10px;\n  overflow: hidden;\n}\n.demo-table th, .demo-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--doc-border); }\n.demo-table th { background: var(--doc-surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: v
