var(--doc-sans);\n  font-size: 12px;\n  padding: 4px 8px;\n  border: 1px solid var(--doc-border);\n  border-radius: 6px;\n  background: #fff;\n}\n.demo-resize-stage {\n  background: var(--doc-surface-2);\n  border-radius: 10px;\n  padding: 32px;\n  display: flex;\n  justify-content: center;\n  position: relative;\n  overflow: auto;\n}\n.demo-resize-frame {\n  background: var(--doc-surface);\n  border: 1px solid var(--doc-border);\n  border-radius: 8px;\n  padding: 20px;\n  resize: horizontal;\n  overflow: hidden;\n  min-width: 120px;\n  max-width: 100%;\n  position: relative;\n  transition: width 0ms;\n}\n.demo-resize-frame.demo-frame-height {\n  resize: both;\n  overflow: hidden;\n}\n/* SCROLL mode: only the parameters scroll; header + bar are sticky on white bg */\n.demo-resize-frame.demo-frame-scroll {\n  overflow-y: auto;\n  overflow-x: hidden;\n}\n.demo-resize-frame.demo-frame-scroll .sbw { gap: 0; }\n.demo-resize-frame.demo-frame-scroll .sbw-stuck {\n  position: sticky;\n  top: -20px; /* pull up into the frame's top padding so no padding shows under sticky */\n  z-index: 3;\n  background: var(--doc-surface);\n  margin: -20px -20px 0; /* extend bg over the frame's padding */\n  padding: 20px 20px 12px;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  box-shadow: 0 6px 8px -8px rgba(20, 24, 40, 0.18);\n}\n.demo-resize-frame.demo-frame-scroll .sbw-list { padding-top: 8px; }\n\n.demo-resize-frame.demo-frame-fade::before {\n  content: \"\";\n  position: absolute;\n  left: 20px;\n  right: 20px;\n  bottom: 0;\n  height: 56px;\n  background: linear-gradient(to bottom, transparent, var(--doc-surface) 60%);\n  pointer-events: none;\n  z-index: 1;\n}\n\n/* expand button — sits INSIDE the frame at the bottom */\n.demo-expand-btn {\n  position: absolute;\n  left: 20px;\n  bottom: 12px;\n  z-index: 2;\n  background: var(--doc-surface);\n  border: 1px solid var(--doc-border);\n  color: var(--doc-accent);\n  font: inherit;\n  font-size: 12px;\n  padding: 6px 14px;\n  border-radius: 6px;\n  cursor: pointer;\n  box-shadow: 0 1px 2px rgba(0,0,0,0.04);\n}\n.demo-expand-btn:hover { background: var(--doc-surface-2); }\n\n/* overflow link — \"Ещё N позиций\" inside fade frame */\n.demo-overflow-link {\n  position: absolute;\n  left: 20px;\n  bottom: 14px;\n  z-index: 2;\n  font-size: 12px;\n  color: var(--doc-accent);\n  text-decoration: none;\n  background: var(--doc-surface);\n  padding: 2px 0;\n}\n.demo-overflow-link:hover { text-decoration: underline; }\n.demo-resize-frame.demo-frame-expand:not(.demo-frame-height) {\n  /* expanded — no fade, button still positioned at bottom */\n  padding-bottom: 56px;\n}\n.demo-resize-frame.demo-frame-expand:not(.demo-frame-height)::before { display: none; }\n.demo-resize-frame::after {\n  content: attr(data-width) \"px\";\n  position: absolute;\n  top: -10px;\n  right: 12px;\n  background: var(--doc-bg);\n  padding: 0 8px;\n  font-family: var(--doc-mono);\n  font-size: 10px;\n  color: var(--doc-fg-faint);\n  letter-spacing: 0.06em;\n}\n\n/* ====== checklist ====== */\n.doc-checklist {\n  background: var(--doc-surface);\n  border: 1px solid var(--doc-border);\n  border-radius: 12px;\n  padding: 24px;\n  list-style: none;\n  margin: 16px 0;\n}\n.doc-checklist li {\n  display: grid;\n  grid-template-columns: 22px 1fr;\n  gap: 10px;\n  padding: 8px 0;\n  align-items: start;\n  font-size: 13px;\n  border-bottom: 1px solid var(--doc-border);\n}\n.doc-checklist li:last-child { border-bottom: 0; }\n.doc-checklist li::before {\n  content: \"\";\n  width: 16px;\n  height: 16px;\n  margin-top: 3px;\n  border: 1.5px solid var(--doc-border-strong);\n  border-radius: 4px;\n  display: inline-block;\n}\n\n/* anti-pattern label */\n.doc-bad, .doc-good {\n  font-family: var(--doc-mono);\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  padding: 2px 8px;\n  border-radius: 4px;\n}\n.doc-bad  { background: var(--doc-warn-soft); color: var(--doc-warn); }\n.doc-good { background: var(--doc-ok-soft);   color: var(--doc-ok);   }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"doc-shell\">\n\n  <!-- ===================== STICKY NAV ===================== -->\n  <aside class=\"doc-nav\">\n    <div class=\"doc-nav-brand\">Design System / Data Viz<\u002Fdiv>\n    <div class=\"doc-nav-title\">Summary Breakdown<\u002Fdiv>\n    <ol>\n      <li><a href=\"#s1\">1. Обзор<\u002Fa><\u002Fli>\n      <li><a href=\"#s-anatomy\" class=\"doc-nav-sub\">Анатомия<\u002Fa><\u002Fli>\n      <li><a href=\"#s-props\" class=\"doc-nav-sub\">Параметры<\u002Fa><\u002Fli>\n      <li><a href=\"#s2\">2. Режимы отображения<\u002Fa><\u002Fli>\n      <li><a href=\"#s3\">3. Количество позиций<\u002Fa><\u002Fli>\n      <li><a href=\"#s4\">4. Состояния<\u002Fa><\u002Fli>\n      <li><a href=\"#s5\">5. Цветовая система<\u002Fa><\u002Fli>\n      <li><a href=\"#s6\">6. Прогресс-бар<\u002Fa><\u002Fli>\n      <li><a href=\"#s7\">7. Адаптивность<\u002Fa><\u002Fli>\n      <li><a href=\"#s71\" class=\"doc-nav-sub\">7.1 Ширина<\u002Fa><\u002Fli>\n      <li><a href=\"#s72\" class=\"doc-nav-sub\">7.2 Высота<\u002Fa><\u002Fli>\n      <li><a href=\"#s73\" class=\"doc-nav-sub\">7.3 Растяжение<\u002Fa><\u002Fli>\n      <li><a href=\"#s74\" class=\"doc-nav-sub\">7.4 Лейауты<\u002Fa><\u002Fli>\n      <li><a href=\"#s75\" class=\"doc-nav-sub\">7.5 Динамика<\u002Fa><\u002Fli>\n      <li><a href=\"#s76\" class=\"doc-nav-sub\">7.6 Контент<\u002Fa><\u002Fli>\n      <li><a href=\"#s77\" class=\"doc-nav-sub\">7.7 A11y<\u002Fa><\u002Fli>\n      <li><a href=\"#s-demo\">Интерактивный демо<\u002Fa><\u002Fli>\n      <li><a href=\"#s8\">8. Числа и типографика<\u002Fa><\u002Fli>\n      <li><a href=\"#s9\">9. Корнер-кейсы<\u002Fa><\u002Fli>\n      <li><a href=\"#s10\">10. JSON<\u002Fa><\u002Fli>\n      <li><a href=\"#s11\">11. Checklist<\u002Fa><\u002Fli>\n      <li><a href=\"#s12\">12. Out of scope<\u002Fa><\u002Fli>\n    <\u002Fol>\n  <\u002Faside>\n\n  <!-- ===================== MAIN ===================== -->\n  <main class=\"doc-main\">\n\n    <header>\n      <div class=\"doc-eyebrow\">Component · v1.0 · Status: Stable<\u002Fdiv>\n      <h1 class=\"doc-h1\">Summary Breakdown Widget<\u002Fh1>\n      <p class=\"doc-lead\">\n        Универсальный компонент для отображения итогового числового значения и его\n        детализации по составляющим. Не привязан к доменной области — используется\n        для финансовых сумм, количества штук, документов, сделок или любых других\n        агрегируемых величин.\n      <\u002Fp>\n    <\u002Fheader>\n\n    <!-- ============== 1. ОВЕРВЬЮ ============== -->\n    <h2 class=\"doc-h2\" id=\"s1\"><span class=\"doc-h2-num\">01<\u002Fspan>Обзор компонента<\u002Fh2>\n\n    <p class=\"doc-p\">\n      <strong>Принцип универсальности.<\u002Fstrong> Компонент не знает, что такое «кредит» или\n      «акции». Он принимает массив <code class=\"doc-inline-code\">items[]<\u002Fcode> с\n      произвольными лейблами и значениями. Все доменные термины приходят снаружи как props.\n    <\u002Fp>\n    <p class=\"doc-p\">\n      <strong>Где применяется.<\u002Fstrong> Карточки на дашборде, сайдбары детализации,\n      виджеты в модальных окнах и аккордеонах. Не подходит для случаев, где нужна\n      сортировка пользователем, drill-down или редактирование значений — см. раздел 12.\n    <\u002Fp>\n\n    <!-- Anatomy -->\n    <h3 class=\"doc-h3\" id=\"s-anatomy\"><span class=\"doc-h3-num\">1.1<\u002Fspan>Анатомия<\u002Fh3>\n\n    <div class=\"doc-anatomy\">\n      <svg viewBox=\"0 0 980 380\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica, Arial, sans-serif\">\n        <defs>\n          <marker id=\"anaArr\" viewBox=\"0 0 8 8\" refX=\"4\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">\n            <path d=\"M0,0 L8,4 L0,8 z\" fill=\"#A5ABBA\"><\u002Fpath>\n          <\u002Fmarker>\n          <marker id=\"anaArrEnd\" viewBox=\"0 0 8 8\" refX=\"4\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n            <path d=\"M0,0 L8,4 L0,8 z\" fill=\"#A5ABBA\"><\u002Fpath>\n          <\u002Fmarker>\n        <\u002Fdefs>\n\n        <!-- THE COMPONENT — rendered as plain elements, no decorative frame -->\n        <!-- header: label + total, baseline-aligned -->\n        <text x=\"60\" y=\"60\" font-size=\"13\" fill=\"#54596A\">ВБС по сделке на 25.02.2026, млн. руб.<\u002Ftext>\n        <text x=\"540\" y=\"60\" font-size=\"18\" font-weight=\"700\" fill=\"#1B1D24\" text-anchor=\"end\">1 279<\u002Ftext>\n\n        <!-- bar: 8px height, stacked segments with 2px gaps, full radius -->\n        <g>\n          <rect x=\"60\" y=\"84\" width=\"200\" height=\"8\" rx=\"4\" ry=\"4\" fill=\"#7C7AED\"><\u002Frect>\n          <rect x=\"262\" y=\"84\" width=\"160\" height=\"8\" fill=\"#6CC36E\"><\u002Frect>\n          <rect x=\"424\" y=\"84\" width=\"100\" height=\"8\" fill=\"#5FB8D6\"><\u002Frect>\n          <rect x=\"526\" y=\"84\" width=\"14\" height=\"8\" rx=\"4\" ry=\"4\" fill=\"#E87B6F\"><\u002Frect>\n        <\u002Fg>\n\n        <!-- rows -->\n        <g font-size=\"14\" fill=\"#1B1D24\">\n          <g transform=\"translate(60,116)\">\n            <circle cx=\"7\" cy=\"10\" r=\"4\" fill=\"#7C7AED\"><\u002Fcircle>\n            <text x=\"24\" y=\"14\">Кредит<\u002Ftext>\n            <text x=\"460\" y=\"14\" text-anchor=\"end\" fill=\"#54596A\">35,00%<\u002Ftext>\n            <text x=\"540\" y=\"14\" text-anchor=\"end\">511,60<\u002Ftext>\n          <\u002Fg>\n          <g transform=\"translate(60,148)\">\n            <circle cx=\"7\" cy=\"10\" r=\"4\" fill=\"#6CC36E\"><\u002Fcircle>\n            <text x=\"24\" y=\"14\">Акции<\u002Ftext>\n            <text x=\"460\" y=\"14\" text-anchor=\"end\" fill=\"#54596A\">35,00%<\u002Ftext>\n            <text x=\"540\" y=\"14\" text-anchor=\"end\">511,60<\u002Ftext>\n          <\u002Fg>\n          <g transform=\"translate(60,180)\">\n            <circle cx=\"7\" cy=\"10\" r=\"4\" fill=\"#5FB8D6\"><\u002Fcircle>\n            <text x=\"24\" y=\"14\">РЕПО<\u002Ftext>\n            <text x=\"460\" y=\"14\" text-anchor=\"end\" fill=\"#54596A\">25,00%<\u002Ftext>\n            <text x=\"540\" y=\"14\" text-anchor=\"end\">511,60<\u002Ftext>\n          <\u002Fg>\n          <g transform=\"translate(60,212)\">\n            <circle cx=\"7\" cy=\"10\" r=\"4\" fill=\"#E87B6F\"><\u002Fcircle>\n            <text x=\"24\" y=\"14\">Комиссия<\u002Ftext>\n            <text x=\"460\" y=\"14\" text-anchor=\"end\" fill=\"#54596A\">5,00%<\u002Ftext>\n            <text x=\"540\" y=\"14\" text-anchor=\"end\">511,60<\u002Ftext>\n          <\u002Fg>\n        <\u002Fg>\n\n        <!-- ============ ANNOTATIONS ============ -->\n        <g stroke=\"#C2C6D2\" stroke-width=\"1\" fill=\"none\">\n          <!-- Label leader (top): label → callout -->\n          <path d=\"M 80 48 L 80 32 L 280 32\"><\u002Fpath>\n          <!-- Total leader (right of total) -->\n          <path d=\"M 555 60 L 600 60 L 700 60\"><\u002Fpath>\n          <!-- Bar leader (mid bar) -->\n          <path d=\"M 480 88 L 600 88 L 700 88\"><\u002Fpath>\n          <!-- Row label leader -->\n          <path d=\"M 120 130 L 120 252 L 700 252\"><\u002Fpath>\n          <!-- Row percent leader -->\n          <path d=\"M 440 130 L 440 280 L 700 280\"><\u002Fpath>\n          <!-- Row value leader -->\n          <path d=\"M 530 130 L 530 308 L 700 308\"><\u002Fpath>\n          <!-- Dot leader -->\n          <path d=\"M 67 126 L 30 126 L 30 340 L 700 340\"><\u002Fpath>\n        <\u002Fg>\n        <g fill=\"#54596A\" font-family=\"ui-monospace, monospace\" font-size=\"11\">\n          <text x=\"284\" y=\"35\">label · sublabel<\u002Ftext>\n          <text x=\"704\" y=\"63\">total<\u002Ftext>\n          <text x=\"704\" y=\"91\">progress bar · 8px<\u002Ftext>\n          <text x=\"704\" y=\"255\">row label<\u002Ftext>\n          <text x=\"704\" y=\"283\">percent<\u002Ftext>\n          <text x=\"704\" y=\"311\">value<\u002Ftext>\n          <text x=\"704\" y=\"343\">dot-маркер · 8px<\u002Ftext>\n        <\u002Fg>\n\n        <!-- ============ SPACING DIMENSIONS (left side) ============ -->\n        <g stroke=\"#5853D9\" stroke-width=\"1\" fill=\"none\" opacity=\"0.5\">\n          <!-- label baseline at y=60 → label bottom ~y=70; bar top y=84 (assume 14px diagram == 8px actual, scale for clarity) -->\n          <!-- gap header → bar: label 8px -->\n          <line x1=\"40\" y1=\"70\" x2=\"40\" y2=\"84\" marker-start=\"url(#anaArrEnd)\" marker-end=\"url(#anaArr)\"><\u002Fline>\n          <!-- gap bar → first row: 8px -->\n          <line x1=\"40\" y1=\"92\" x2=\"40\" y2=\"116\" marker-start=\"url(#anaArrEnd)\" marker-end=\"url(#anaArr)\"><\u002Fline>\n          <!-- row min-height: 24px -->\n          <line x1=\"40\" y1=\"130\" x2=\"40\" y2=\"148\" marker-start=\"url(#anaArrEnd)\" marker-end=\"url(#anaArr)\"><\u002Fline>\n        <\u002Fg>\n        <g fill=\"#5853D9\" font-family=\"ui-monospace, monospace\" font-size=\"10\">\n          <text x=\"14\" y=\"80\">8<\u002Ftext>\n          <text x=\"14\" y=\"106\">8<\u002Ftext>\n          <text x=\"14\" y=\"142\">24<\u002Ftext>\n        <\u002Fg>\n\n        <!-- ============ BAR DIMENSIONS (above bar) ============ -->\n        <g stroke=\"#5853D9\" stroke-width=\"1\" fill=\"none\" opacity=\"0.5\">\n          <!-- 2px gap between segments — tiny -->\n          <line x1=\"260\" y1=\"74\" x2=\"262\" y2=\"74\" marker-start=\"url(#anaArrEnd)\" marker-end=\"url(#anaArr)\"><\u002Fline>\n        <\u002Fg>\n        <g fill=\"#5853D9\" font-family=\"ui-monospace, monospace\" font-size=\"10\">\n          <text x=\"266\" y=\"76\">gap 2<\u002Ftext>\n        <\u002Fg>\n      <\u002Fsvg>\n      <div class=\"doc-card-note\">\n        Размеры в фиолетовом — отступы и высоты в пикселях. Серые выносные линии указывают на элементы компонента.\n        Числовые колонки выровнены по правому краю; tabular-nums гарантирует, что цифры не «прыгают» при смене значения.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Props -->\n    <h3 class=\"doc-h3\" id=\"s-props\"><span class=\"doc-h3-num\">1.2<\u002Fspan>Параметры (props)<\u002Fh3>\n\n    <div class=\"doc-table-wrap\">\n      <table class=\"doc-table\">\n        <thead>\n          <tr><th>Параметр<\u002Fth><th>Тип<\u002Fth><th>Обяз.<\u002Fth><th>Описание<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr><td><code>label<\u002Fcode><\u002Ftd><td><code>string<\u002Fcode><\u002Ftd><td><span class=\"req\">req<\u002Fspan><\u002Ftd><td>Заголовок (название показателя)<\u002Ftd><\u002Ftr>\n          <tr><td><code>sublabel<\u002Fcode><\u002Ftd><td><code>string<\u002Fcode><\u002Ftd><td><span class=\"opt\">opt<\u002Fspan><\u002Ftd><td>Подзаголовок (дата, период, уточнение)<\u002Ftd><\u002Ftr>\n          <tr><td><code>unit<\u002Fcode><\u002Ftd><td><code>string<\u002Fcode><\u002Ftd><td><span class=\"opt\">opt<\u002Fspan><\u002Ftd><td>Единица измерения (млн. руб., шт., %)<\u002Ftd><\u002Ftr>\n          <tr><td><code>total<\u002Fcode><\u002Ftd><td><code>number<\u002Fcode><\u002Ftd><td><span class=\"req\">req<\u002Fspan><\u002Ftd><td>Итоговое значение<\u002Ftd><\u002Ftr>\n          <tr><td><code>status<\u002Fcode><\u002Ftd><td><code>\"loaded\" | \"loading\" | \"error\" | \"empty\"<\u002Fcode><\u002Ftd><td><span class=\"req\">req<\u002Fspan><\u002Ftd><td>Состояние компонента<\u002Ftd><\u002Ftr>\n          <tr><td><code>showPercent<\u002Fcode><\u002Ftd><td><code>boolean<\u002Fcode><\u002Ftd><td><span class=\"opt\">opt<\u002Fspan><\u002Ftd><td>Показывать % в строках (default: <code>true<\u002Fcode>)<\u002Ftd><\u002Ftr>\n          <tr><td><code>showProgressBar<\u002Fcode><\u002Ftd><td><code>boolean<\u002Fcode><\u002Ftd><td><span class=\"opt\">opt<\u002Fspan><\u002Ftd><td>Показывать прогресс-бар (default: <code>true<\u002Fcode>)<\u002Ftd><\u002Ftr>\n          <tr><td><code>maxVisibleItems<\u002Fcode><\u002Ftd><td><code>number<\u002Fcode><\u002Ftd><td><span class=\"opt\">opt<\u002Fspan><\u002Ftd><td>Максимум строк до «Показать ещё» (default: <code>5<\u002Fcode>)<\u002Ftd><\u002Ftr>\n          <tr><td><code>items[]<\u002Fcode><\u002Ftd><td><code>array<\u002Fcode><\u002Ftd><td><span class=\"opt\">opt<\u002Fspan><\u002Ftd><td>Список позиций (пусто = empty state)<\u002Ftd><\u002Ftr>\n          <tr><td><code>items[].id<\u002Fcode><\u002Ftd><td><code>string<\u002Fcode><\u002Ftd><td><span class=\"req\">req<\u002Fspan><\u002Ftd><td>Уникальный идентификатор<\u002Ftd><\u002Ftr>\n          <tr><td><code>items[].label<\u002Fcode><\u002Ftd><td><code>string<\u002Fcode><\u002Ftd><td><span class=\"req\">req<\u002Fspan><\u002Ftd><td>Название позиции<\u002Ftd><\u002Ftr>\n          <tr><td><code>items[].value<\u002Fcode><\u002Ftd><td><code>number<\u002Fcode><\u002Ftd><td><span class=\"req\">req<\u002Fspan><\u002Ftd><td>Абсолютное значение<\u002Ftd><\u002Ftr>\n          <tr><td><code>items[].percent<\u002Fcode><\u002Ftd><td><code>number | null<\u002Fcode><\u002Ftd><td><span class=\"opt\">opt<\u002Fspan><\u002Ftd><td><code>null<\u002Fcode> = считать автоматически как <code>value / total<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td><code>items[].color<\u002Fcode><\u002Ftd><td><code>string | null<\u002Fcode><\u002Ftd><td><span class=\"opt\">opt<\u002Fspan><\u002Ftd><td><code>null<\u002Fcode> = из палитры по порядку<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 2. РЕЖИМЫ ============== -->\n    <h2 class=\"doc-h2\" id=\"s2\"><span class=\"doc-h2-num\">02<\u002Fspan>Режимы отображения<\u002Fh2>\n    <p class=\"doc-p\">\n      Четыре комбинации флагов <code class=\"doc-inline-code\">showPercent<\u002Fcode> и\n      <code class=\"doc-inline-code\">showProgressBar<\u002Fcode> покрывают разную плотность данных.\n      По умолчанию активны оба — это рекомендуемый режим.\n    <\u002Fp>\n\n    <div class=\"doc-grid doc-grid-2\">\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\">\n          <div class=\"doc-card-title\">Полный<\u002Fdiv>\n          <div class=\"doc-card-meta\">showPercent: true · showProgressBar: true<\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"ex-mode-full\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Рекомендуется по умолчанию. Самый информативный вариант.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\">\n          <div class=\"doc-card-title\">Без процентов<\u002Fdiv>\n          <div class=\"doc-card-meta\">showPercent: false · showProgressBar: true<\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"ex-mode-no-pct\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Когда абсолютные значения важнее долей.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\">\n          <div class=\"doc-card-title\">Без бара<\u002Fdiv>\n          <div class=\"doc-card-meta\">showPercent: true · showProgressBar: false<\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"ex-mode-no-bar\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Для очень компактных мест или печати.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\">\n          <div class=\"doc-card-title\">Минимальный<\u002Fdiv>\n          <div class=\"doc-card-meta\">showPercent: false · showProgressBar: false<\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"ex-mode-min\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Текстовая сводка — для ячеек таблиц и плотных списков.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 3. КОЛИЧЕСТВО ============== -->\n    <h2 class=\"doc-h2\" id=\"s3\"><span class=\"doc-h2-num\">03<\u002Fspan>Варианты по количеству позиций<\u002Fh2>\n    <p class=\"doc-p\">\n      Компонент стабилен от 0 до 100+ позиций. Поведение зависит от количества:\n      пустое состояние, обычное отображение, или сворачивание под «Показать ещё».\n    <\u002Fp>\n\n    <div class=\"doc-grid doc-grid-2\">\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">1 позиция<\u002Fdiv><div class=\"doc-card-meta\">items: 1<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-count-1\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Бар — однородный, занимает 100% ширины. Показывается, чтобы сохранить ритм с другими карточками на дашборде.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">2 позиции<\u002Fdiv><div class=\"doc-card-meta\">items: 2<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-count-2\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Оптимально для бинарных распределений.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">3 позиции<\u002Fdiv><div class=\"doc-card-meta\">items: 3<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-count-3\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">5 позиций<\u002Fdiv><div class=\"doc-card-meta\">items: 5 · граница maxVisibleItems<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-count-5\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 class=\"doc-h4\">6+ позиций — два решения<\u002Fh4>\n    <p class=\"doc-p\">\n      При превышении <code class=\"doc-inline-code\">maxVisibleItems<\u002Fcode> возможны две стратегии.\n      <strong>Рекомендуется «Показать ещё»<\u002Fstrong> — она сохраняет всю высоту контекста и\n      понятна при первом взгляде. Внутренний скролл — только если контейнер компонента\n      жёстко ограничен по высоте и нет места для разворота.\n    <\u002Fp>\n\n    <div class=\"doc-grid doc-grid-2\">\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\">\n          <div class=\"doc-card-title\">«Показать ещё N» <span class=\"doc-good\">recommended<\u002Fspan><\u002Fdiv>\n          <div class=\"doc-card-meta\">items: 8 · maxVisibleItems: 5<\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"ex-count-many\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Кнопка раскрытия — текстовая, без иконки шеврона. После раскрытия не возвращаемся к свёрнутому виду в этом сеансе.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\">\n          <div class=\"doc-card-title\">Внутренний скролл <span class=\"doc-bad\">avoid by default<\u002Fspan><\u002Fdiv>\n          <div class=\"doc-card-meta\">items: 8 · scrollable: true<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"demo-scrollable\" id=\"ex-count-scroll\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Включается только через явный prop <code>scrollable: true<\u002Fcode>. Вложенный скролл вреден: ломает скролл страницы, конфликтует с тач-жестами, прячет важные данные.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 class=\"doc-h4\">0 позиций — empty state<\u002Fh4>\n    <div class=\"doc-card\">\n      <div class=\"doc-card-header\"><div class=\"doc-card-title\">items: [] или undefined<\u002Fdiv><div class=\"doc-card-meta\">status: \"empty\"<\u002Fdiv><\u002Fdiv>\n      <div id=\"ex-state-empty\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 4. СОСТОЯНИЯ ============== -->\n    <h2 class=\"doc-h2\" id=\"s4\"><span class=\"doc-h2-num\">04<\u002Fspan>Состояния компонента<\u002Fh2>\n    <p class=\"doc-p\">\n      Состояние — это атомарный <code class=\"doc-inline-code\">status<\u002Fcode> + три производных\n      от данных: <code class=\"doc-inline-code\">partial<\u002Fcode> (сумма позиций &lt; total),\n      <code class=\"doc-inline-code\">overflow<\u002Fcode> (сумма &gt; total),\n      <code class=\"doc-inline-code\">zero item<\u002Fcode> (позиция со значением 0).\n    <\u002Fp>\n\n    <div class=\"doc-grid doc-grid-2\">\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Loaded<\u002Fdiv><div class=\"doc-card-meta\">status: \"loaded\"<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-state-loaded\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Loading — fast (&lt; 3 сек)<\u002Fdiv><div class=\"doc-card-meta\">status: \"loading\"<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-state-loading\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Полный скелетон: total, бар и строки. Используется при коротких ожиданиях (до 3 секунд) — не отвлекает пользователя текстовыми пояснениями.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Loading — slow (≥ 3 сек)<\u002Fdiv><div class=\"doc-card-meta\">loadingVariant: \"slow\"<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-state-loading-slow\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Когда вычисление дольше 3 секунд — скелетоны только у total и прогресс-бара, а вместо строк появляется плашка «Данные рассчитываются · Это может занять несколько секунд». Так пользователь понимает, что ожидание оправдано.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Error<\u002Fdiv><div class=\"doc-card-meta\">status: \"error\"<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-state-error\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Иконка + краткое сообщение + кнопка «Повторить». Не показываем стек или код ошибки в UI.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Empty<\u002Fdiv><div class=\"doc-card-meta\">status: \"empty\"<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-state-empty-2\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Partial (сумма &lt; total)<\u002Fdiv><div class=\"doc-card-meta\">25 + 25 + 25 = 75%<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-state-partial\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Остаток показывается серым «остатком» в баре, в подвале — поясняющий текст.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Overflow (сумма &gt; total)<\u002Fdiv><div class=\"doc-card-meta\">50 + 40 + 25 = 115%<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-state-overflow\"><\u002Fdiv>\n        <div class=\"doc-card-note\">В подвале — предупреждение. Бар нормализуется по сумме, но цвет подвала сигнализирует о проблеме.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"doc-card\" style=\"margin-top: 16px;\">\n      <div class=\"doc-card-header\"><div class=\"doc-card-title\">Zero item (одна из позиций = 0)<\u002Fdiv><div class=\"doc-card-meta\">item.value: 0<\u002Fdiv><\u002Fdiv>\n      <div id=\"ex-state-zero\"><\u002Fdiv>\n      <div class=\"doc-card-note\">Позиция отображается, но в баре её сегмент не виден. Это нормально: пользователь видит, что показатель учтён, но равен нулю.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 5. ЦВЕТА ============== -->\n    <h2 class=\"doc-h2\" id=\"s5\"><span class=\"doc-h2-num\">05<\u002Fspan>Цветовая система<\u002Fh2>\n    <p class=\"doc-p\">\n      Палитра из <strong>8 цветов<\u002Fstrong>, оптимизированных для соседства в одном баре.\n      Цвета подобраны с одинаковой светлотой и насыщенностью — ни один не «доминирует»\n      визуально. Контраст с белым фоном — не менее 3:1 (WCAG AA для non-text графики).\n    <\u002Fp>\n\n    <div class=\"doc-palette\">\n      <div class=\"doc-swatch\"><div class=\"doc-swatch-color\" style=\"background:#7C7AED\"><\u002Fdiv><div class=\"doc-swatch-meta\"><div class=\"doc-swatch-num\">01<\u002Fdiv><div class=\"doc-swatch-name\">Indigo<\u002Fdiv><div class=\"doc-swatch-hex\">#7C7AED<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"doc-swatch\"><div class=\"doc-swatch-color\" style=\"background:#6CC36E\"><\u002Fdiv><div class=\"doc-swatch-meta\"><div class=\"doc-swatch-num\">02<\u002Fdiv><div class=\"doc-swatch-name\">Mint<\u002Fdiv><div class=\"doc-swatch-hex\">#6CC36E<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"doc-swatch\"><div class=\"doc-swatch-color\" style=\"background:#5FB8D6\"><\u002Fdiv><div class=\"doc-swatch-meta\"><div class=\"doc-swatch-num\">03<\u002Fdiv><div class=\"doc-swatch-name\">Sky<\u002Fdiv><div class=\"doc-swatch-hex\">#5FB8D6<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"doc-swatch\"><div class=\"doc-swatch-color\" style=\"background:#E87B6F\"><\u002Fdiv><div class=\"doc-swatch-meta\"><div class=\"doc-swatch-num\">04<\u002Fdiv><div class=\"doc-swatch-name\">Coral<\u002Fdiv><div class=\"doc-swatch-hex\">#E87B6F<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"doc-swatch\"><div class=\"doc-swatch-color\" style=\"background:#E8B85F\"><\u002Fdiv><div class=\"doc-swatch-meta\"><div class=\"doc-swatch-num\">05<\u002Fdiv><div class=\"doc-swatch-name\">Amber<\u002Fdiv><div class=\"doc-swatch-hex\">#E8B85F<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"doc-swatch\"><div class=\"doc-swatch-color\" style=\"background:#DE7BAE\"><\u002Fdiv><div class=\"doc-swatch-meta\"><div class=\"doc-swatch-num\">06<\u002Fdiv><div class=\"doc-swatch-name\">Pink<\u002Fdiv><div class=\"doc-swatch-hex\">#DE7BAE<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"doc-swatch\"><div class=\"doc-swatch-color\" style=\"background:#4FB8A8\"><\u002Fdiv><div class=\"doc-swatch-meta\"><div class=\"doc-swatch-num\">07<\u002Fdiv><div class=\"doc-swatch-name\">Teal<\u002Fdiv><div class=\"doc-swatch-hex\">#4FB8A8<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"doc-swatch\"><div class=\"doc-swatch-color\" style=\"background:#8896A8\"><\u002Fdiv><div class=\"doc-swatch-meta\"><div class=\"doc-swatch-num\">08<\u002Fdiv><div class=\"doc-swatch-name\">Slate<\u002Fdiv><div class=\"doc-swatch-hex\">#8896A8<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 class=\"doc-h4\">Правила назначения<\u002Fh4>\n    <p class=\"doc-p\">\n      Цвет берётся по индексу позиции: первая позиция → Indigo, вторая → Mint, и т. д.\n      Это значит, что у одной и той же сущности (например, «Кредит») цвет может отличаться\n      в разных виджетах — это <em>намеренно<\u002Fem>. Если консистентность важна, передавайте\n      <code class=\"doc-inline-code\">items[].color<\u002Fcode> явно.\n    <\u002Fp>\n\n    <h4 class=\"doc-h4\">Поведение при 9+ позициях<\u002Fh4>\n    <p class=\"doc-p\">\n      Палитра не циклится. С 9-й позиции включается стратегия group-into-other:\n      девятая и далее объединяются в одну виртуальную позицию «Прочее» цвета Slate (08).\n      Это сохраняет визуальную читаемость бара и предотвращает повторение цветов.\n    <\u002Fp>\n\n    <div class=\"doc-card\">\n      <div class=\"doc-card-header\"><div class=\"doc-card-title\">Все 8 цветов в одном баре<\u002Fdiv><div class=\"doc-card-meta\">items: 8<\u002Fdiv><\u002Fdiv>\n      <div id=\"ex-palette-full\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 class=\"doc-h4\">Тёмная тема<\u002Fh4>\n    <div class=\"doc-card doc-dark-bg\" style=\"background:#15171E;\">\n      <div class=\"doc-card-header\"><div class=\"doc-card-title\" style=\"color:#E8EAF0\">Same palette, dark surface<\u002Fdiv><div class=\"doc-card-meta\" style=\"color:#8A8F9E\">.sbw-dark wrapper<\u002Fdiv><\u002Fdiv>\n      <div class=\"sbw-dark\" id=\"ex-palette-dark\"><\u002Fdiv>\n      <div class=\"doc-card-note\" style=\"color:#8A8F9E;border-color:#2A2D38\">Цвета палитры не инвертируются — они работают на обеих темах. Меняются только нейтрали: фон, текст, бордеры.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 6. ПРОГРЕСС-БАР ============== -->\n    <h2 class=\"doc-h2\" id=\"s6\"><span class=\"doc-h2-num\">06<\u002Fspan>Поведение прогресс-бара<\u002Fh2>\n\n    <h4 class=\"doc-h4\">Минимальная ширина сегмента<\u002Fh4>\n    <p class=\"doc-p\">\n      Сегмент менее 2px невозможно различить на экране. Через ResizeObserver компонент\n      гарантирует <code class=\"doc-inline-code\">min-width: 2px<\u002Fcode> для каждого ненулевого\n      сегмента — остаток ширины распределяется пропорционально между остальными.\n    <\u002Fp>\n    <div class=\"doc-card\">\n      <div class=\"doc-card-header\"><div class=\"doc-card-title\">Доминирующая позиция 99,7%<\u002Fdiv><div class=\"doc-card-meta\">бывший «малый» сегмент остаётся видимым<\u002Fdiv><\u002Fdiv>\n      <div id=\"ex-bar-tiny\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 class=\"doc-h4\">Скругления, gap, hover-связь<\u002Fh4>\n    <ul class=\"doc-p\" style=\"padding-left: 20px;\">\n      <li><strong>Скругление:<\u002Fstrong> <code class=\"doc-inline-code\">border-radius: 999px<\u002Fcode> на контейнере, сегменты обрезаются через <code class=\"doc-inline-code\">overflow: hidden<\u002Fcode>. Первый и последний сегменты получают скругление автоматически.<\u002Fli>\n      <li><strong>Gap:<\u002Fstrong> 2px между сегментами — даёт визуальное разделение без потери компактности.<\u002Fli>\n      <li><strong>Hover-связь:<\u002Fstrong> при наведении на сегмент остальные приглушаются (<code class=\"doc-inline-code\">opacity: 0.55<\u002Fcode>), при наведении на строку — приглушаются все сегменты кроме связанного.<\u002Fli>\n      <li><strong>Tooltip:<\u002Fstrong> по <code class=\"doc-inline-code\">title<\u002Fcode> атрибуту — на нативном механизме браузера. В сложных лейаутах можно подключить кастомный tooltip-компонент.<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"doc-card\">\n      <div class=\"doc-card-header\"><div class=\"doc-card-title\">Hover: попробуйте навести на сегмент или строку<\u002Fdiv><div class=\"doc-card-meta\">items: 3<\u002Fdiv><\u002Fdiv>\n      <div id=\"ex-bar-three\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 7. АДАПТИВНОСТЬ ============== -->\n    <h2 class=\"doc-h2\" id=\"s7\"><span class=\"doc-h2-num\">07<\u002Fspan>Адаптивность и контейнерные ограничения<\u002Fh2>\n\n    <div class=\"doc-callout doc-callout-info\">\n      <span class=\"doc-callout-icon\">i<\u002Fspan>\n      <div>\n        <strong>Компонент адаптируется к ширине своего контейнера, а не вьюпорта.<\u002Fstrong>\n        Это значит, что один и тот же виджет на широком экране в узком сайдбаре\n        ведёт себя как на мобильном — он «знает» сколько у него места локально.\n        Реализуется через <code class=\"doc-inline-code\">container-type: inline-size<\u002Fcode>\n        и CSS Container Queries; для пересчёта ширины сегментов бара —\n        <code class=\"doc-inline-code\">ResizeObserver<\u002Fcode>.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 7.1 -->\n    <h3 class=\"doc-h3\" id=\"s71\"><span class=\"doc-h3-num\">7.1<\u002Fspan>Адаптивность по ширине<\u002Fh3>\n    <p class=\"doc-p\">\n      Четыре контейнерных брейкпоинта: <strong>широкий<\u002Fstrong> (&gt; 480px),\n      <strong>средний<\u002Fstrong> (320–480px), <strong>узкий<\u002Fstrong> (&lt; 320px),\n      <strong>деградация<\u002Fstrong> (&lt; 160px).\n    <\u002Fp>\n\n    <!-- wide -->\n    <h4 class=\"doc-h4\">Широкий — &gt; 480px (базовый вид)<\u002Fh4>\n    <div class=\"doc-container-box\" style=\"width: 540px; max-width: 100%;\">\n      <div class=\"doc-container-tag\">container: 540px<\u002Fdiv>\n      <div id=\"ex-w-wide\"><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"doc-p\" style=\"margin-top: 12px;\">\n      Всё отображается: label · percent · value в одной строке, числа выровнены\n      по правому краю, dot-маркер 8px, total 18px.\n    <\u002Fp>\n\n    <!-- mid -->\n    <h4 class=\"doc-h4\">Средний — 320–480px (компактный)<\u002Fh4>\n    <div class=\"doc-container-box\" style=\"width: 400px; max-width: 100%;\">\n      <div class=\"doc-container-tag\">container: 400px<\u002Fdiv>\n      <div id=\"ex-w-mid\"><\u002Fdiv>\n    <\u002Fdiv>\n    <ul class=\"doc-p\" style=\"padding-left: 20px; margin-top: 12px;\">\n      <li>Long-label позиций обрезаются с <code class=\"doc-inline-code\">...<\u002Fcode> + tooltip при hover<\u002Fli>\n      <li>Total уменьшается до 16px, шрифт строк — до 13px<\u002Fli>\n      <li>Колонки <code class=\"doc-inline-code\">percent<\u002Fcode> и <code class=\"doc-inline-code\">value<\u002Fcode> сближаются (min-width: 56 / 64px)<\u002Fli>\n      <li>Unit можно сократить (передаётся в prop как короткая строка)<\u002Fli>\n    <\u002Ful>\n\n    <!-- narrow -->\n    <h4 class=\"doc-h4\">Узкий — &lt; 320px<\u002Fh4>\n    <div class=\"doc-container-box\" style=\"width: 280px; max-width: 100%;\">\n      <div class=\"doc-container-tag\">container: 280px<\u002Fdiv>\n      <div id=\"ex-w-narrow\"><\u002Fdiv>\n    <\u002Fdiv>\n    <ul class=\"doc-p\" style=\"padding-left: 20px; margin-top: 12px;\">\n      <li>Колонка <code class=\"doc-inline-code\">percent<\u002Fcode> скрывается принудительно<\u002Fli>\n      <li>Прогресс-бар сохраняет базовую высоту 8px — никогда не утончается<\u002Fli>\n      <li>Строки переходят в двухстрочный режим: label сверху, value снизу<\u002Fli>\n      <li>Total — 15px<\u002Fli>\n    <\u002Ful>\n\n    <!-- very narrow -->\n    <h4 class=\"doc-h4\">Очень узкий — &lt; 200px<\u002Fh4>\n    <div class=\"doc-container-box\" style=\"width: 200px; max-width: 100%;\">\n      <div class=\"doc-container-tag\">container: 200px<\u002Fdiv>\n      <div id=\"ex-w-tiny\"><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"doc-p\" style=\"margin-top: 12px;\">\n      Видны только label и total. Детализация сворачивается за триггером «Развернуть» —\n      разворачивается в всплывающий попап (controlled через\n      <code class=\"doc-inline-code\">aria-expanded<\u002Fcode>).\n    <\u002Fp>\n\n    <h4 class=\"doc-h4\">Деградация — &lt; 160px<\u002Fh4>\n    <div class=\"doc-container-box\" style=\"width: 160px; max-width: 100%;\">\n      <div class=\"doc-container-tag\">container: 160px<\u002Fdiv>\n      <div>\n        <div class=\"sbw-host\" data-status=\"loaded\" style=\"container-type: inline-size;\">\n          <div class=\"sbw\">\n            <div class=\"sbw-header\" style=\"flex-direction: column; align-items: flex-start; gap: 4px;\">\n              <div class=\"sbw-label\" style=\"font-size: 11px;\">ВБС по сделке<\u002Fdiv>\n              <div class=\"sbw-total\" style=\"font-size: 18px;\">1 279<\u002Fdiv>\n            <\u002Fdiv>\n            <a href=\"#\" style=\"font-size: 11px; color: var(--doc-accent); text-decoration: none;\">↗ Подробнее<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"doc-p\" style=\"margin-top: 12px;\">\n      Граница graceful degradation. Ниже 160px компонент <strong>не должен использоваться<\u002Fstrong> —\n      покажите вместо него только total как число или замените на другой компонент.\n    <\u002Fp>\n\n    <div class=\"doc-callout doc-callout-warn\">\n      <span class=\"doc-callout-icon\">!<\u002Fspan>\n      <div>\n        <strong>Что остаётся обязательным на любом размере:<\u002Fstrong> total и label заголовка.\n        Это «ядро» компонента — никогда не скрывается.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 7.2 height -->\n    <h3 class=\"doc-h3\" id=\"s72\"><span class=\"doc-h3-num\">7.2<\u002Fspan>Адаптивность по высоте — ограниченный контейнер<\u002Fh3>\n    <p class=\"doc-p\">\n      Реальный кейс: виджет помещён в карточку с фиксированной высотой, и список позиций\n      не помещается. Поведение зависит от того, насколько сильно ограничен контейнер.\n    <\u002Fp>\n\n    <h4 class=\"doc-h4\">Сценарий A — контейнер чуть меньше нужного<\u002Fh4>\n    <p class=\"doc-p\">\n      1–2 строки не влезают. Снизу появляется fade-градиент,\n      затухание подсказывает что контент продолжается. Под fade — ссылка «Ещё N позиций».\n    <\u002Fp>\n    <div class=\"doc-container-box\">\n      <div class=\"doc-container-tag\">height: 140px · item count: 8<\u002Fdiv>\n      <div class=\"sbw-host\" data-height=\"A\" id=\"ex-h-a\"><\u002Fdiv>\n      <a href=\"#\" style=\"position: relative; top: -16px; font-size: 12px; color: var(--doc-accent); padding-left: 4px;\">Ещё 4 позиции →<\u002Fa>\n    <\u002Fdiv>\n\n    <h4 class=\"doc-h4\">Сценарий B — влезает только заголовок + бар<\u002Fh4>\n    <p class=\"doc-p\">\n      Детализация полностью скрыта. На прогресс-бар при hover — tooltip с\n      мини-списком всех позиций (label + %).\n    <\u002Fp>\n    <div class=\"doc-container-box\">\n      <div class=\"doc-container-tag\">height: 70px<\u002Fdiv>\n      <div class=\"sbw-host\" data-height=\"B\" id=\"ex-h-b\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 class=\"doc-h4\">Сценарий C — не влезает даже бар<\u002Fh4>\n    <p class=\"doc-p\">\n      Показываются только label + total. Если контейнер ниже 60px — компонент рендерит\n      заглушку с иконкой; ниже 48px компонент <strong>не должен использоваться<\u002Fstrong>.\n    <\u002Fp>\n    <div class=\"doc-container-box\">\n      <div class=\"doc-container-tag\">height: 48px<\u002Fdiv>\n      <div class=\"sbw-host\" data-height=\"C\" id=\"ex-h-c\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"doc-callout doc-callout-info\">\n      <span class=\"doc-callout-icon\">i<\u002Fspan>\n      <div>\n        <strong>Иерархия приоритетов при ограничении высоты:<\u002Fstrong><br>\n        <code class=\"doc-inline-code\">total<\u002Fcode> — никогда не обрезается ·\n        <code class=\"doc-inline-code\">bar<\u002Fcode> — может исчезнуть вторым ·\n        <code class=\"doc-inline-code\">items<\u002Fcode> — исчезают первыми\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 7.3 stretch -->\n    <h3 class=\"doc-h3\" id=\"s73\"><span class=\"doc-h3-num\">7.3<\u002Fspan>Поведение при растяжении<\u002Fh3>\n    <p class=\"doc-p\">\n      Когда компонент попадает в «резиновую» сетку, у него есть рекомендация\n      <code class=\"doc-inline-code\">max-width: 600px<\u002Fcode>. Это не жёсткое ограничение —\n      разработчик может его переопределить, но дефолт защищает от антипаттерна\n      бесконечно растянутых строк.\n    <\u002Fp>\n\n    <div class=\"doc-card\">\n      <div class=\"doc-card-header\">\n        <div class=\"doc-card-title\">Правильно <span class=\"doc-good\">good<\u002Fspan><\u002Fdiv>\n        <div class=\"doc-card-meta\">бар + total — full width · список ограничен 600px<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--doc-surface-2); padding: 24px; border-radius: 8px;\">\n        <div class=\"sbw-stretch\" id=\"ex-stretch-good\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card-note\">Прогресс-бар и total занимают всю ширину контейнера — они хорошо считываются на любом размере. Список параметров ограничен 600px от левого края, поэтому лейбл и значение остаются рядом. Hover-фон строки заливает всю ширину, текст внутри не разъезжается.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"doc-card\">\n      <div class=\"doc-card-header\">\n        <div class=\"doc-card-title\">Антипаттерн <span class=\"doc-bad\">avoid<\u002Fspan><\u002Fdiv>\n        <div class=\"doc-card-meta\">всё растянуто на 100%<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--doc-surface-2); padding: 24px; border-radius: 8px;\">\n        <div style=\"--sbw-max-width: 100%;\" id=\"ex-stretch-bad\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"doc-card-note\">Строки тоже растянуты — значение «511,60» далеко справа от лейбла «Кредит», связь визуально разрывается.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 7.4 layouts -->\n    <h3 class=\"doc-h3\" id=\"s74\"><span class=\"doc-h3-num\">7.4<\u002Fspan>Компонент в специфических лейаутах<\u002Fh3>\n\n    <h4 class=\"doc-h4\">В сайдбаре (~240px)<\u002Fh4>\n    <p class=\"doc-p\">\n      Один из самых частых кейсов. Прогресс-бар занимает всю ширину; label и value —\n      двухстрочный режим; <code class=\"doc-inline-code\">maxVisibleItems: 3<\u002Fcode>,\n      остальные — «Ещё N».\n    <\u002Fp>\n    <div class=\"demo-sidebar\" id=\"ex-sidebar\"><\u002Fdiv>\n\n    <h4 class=\"doc-h4\">В модальном окне<\u002Fh4>\n    <p class=\"doc-p\">\n      Модалка может ресайзиться пользователем — компонент перестраивается через\n      Container Queries автоматически. Показано на двух типичных ширинах:\n    <\u002Fp>\n    <div class=\"doc-grid doc-grid-2\">\n      <div class=\"demo-modal\" style=\"width: 360px;\">\n        <div class=\"demo-modal-bar\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n        <div id=\"ex-modal-360\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"demo-modal\" style=\"width: 100%;\">\n        <div class=\"demo-modal-bar\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n        <div id=\"ex-modal-640\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 class=\"doc-h4\">В коллапсируемой секции (аккордеон)<\u002Fh4>\n    <p class=\"doc-p\">\n      Когда секция закрыта — компонент не рендерится (или рендерится с\n      <code class=\"doc-inline-code\">visibility: hidden<\u002Fcode>, чтобы быть доступным для\n      screen reader). После открытия ResizeObserver пересчитает ширину сегментов\n      на следующем кадре.\n    <\u002Fp>\n    <div class=\"demo-accordion\">\n      <div class=\"demo-accordion-head\" onclick=\"this.parentElement.querySelector('.demo-accordion-body').style.display = this.parentElement.querySelector('.demo-accordion-body').style.display === 'none' ? 'block' : 'none'\">\n        <span>Детализация ВБС<\u002Fspan><span style=\"color: var(--doc-fg-faint)\">▾<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"demo-accordion-body\" id=\"ex-accordion\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 7.5 dynamic -->\n    <h3 class=\"doc-h3\" id=\"s75\"><span class=\"doc-h3-num\">7.5<\u002Fspan>Поведение при динамическом изменении размера<\u002Fh3>\n    <p class=\"doc-p\">\n      Реальный кейс: пользователь двигает сплиттер между панелями. Компонент должен\n      плавно перестраиваться без мерцания.\n    <\u002Fp>\n    <ul class=\"doc-p\" style=\"padding-left: 20px;\">\n      <li>Пересчёт ширины сегментов — через <code class=\"doc-inline-code\">ResizeObserver<\u002Fcode>, не через <code class=\"doc-inline-code\">resize<\u002Fcode>-event окна<\u002Fli>\n      <li><strong>Структурные изменения<\u002Fstrong> (скрытие колонки, двухстрочный режим) — мгновенно, без transition<\u002Fli>\n      <li><strong>Размерные изменения<\u002Fstrong> (font-size, dot, padding) — <code class=\"doc-inline-code\">transition: 150ms ease<\u002Fcode><\u002Fli>\n      <li>Пока ResizeObserver ещё не сработал — рендерится промежуточное состояние с <code class=\"doc-inline-code\">visibility: hidden<\u002Fcode> на баре, total и заголовок видны сразу<\u002Fli>\n    <\u002Ful>\n    <div class=\"doc-callout doc-callout-ok\">\n      <span class=\"doc-callout-icon\">✓<\u002Fspan>\n      <div>Попробуйте сами: в интерактивном демо ниже двигайте ползунок ширины — увидите, как компонент проходит все брейкпоинты.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 7.6 content -->\n    <h3 class=\"doc-h3\" id=\"s76\"><span class=\"doc-h3-num\">7.6<\u002Fspan>Контентно-зависимые ограничения<\u002Fh3>\n\n    <h4 class=\"doc-h4\">Очень длинный sublabel<\u002Fh4>\n    <div class=\"doc-card\">\n      <div id=\"ex-content-long-sub\"><\u002Fdiv>\n      <div class=\"doc-card-note\">Sublabel — одна строка, обрезается с <code>...<\u002Fcode>. Полный текст доступен через title-tooltip. Перенос в две строки <strong>не используется<\u002Fstrong> — нарушает вертикальный ритм.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 class=\"doc-h4\">Очень большое число в total<\u002Fh4>\n    <div class=\"doc-card\">\n      <div id=\"ex-content-big-num\"><\u002Fdiv>\n      <div class=\"doc-card-note\">\n        Числа выше 999 999 999 — переходим на компактный формат через <code class=\"doc-inline-code\">SummaryBreakdown.fmtCompact()<\u002Fcode>:\n        <code>1,5 млрд<\u002Fcode> вместо <code>1 500 000 000<\u002Fcode>. Шрифт total использует\n        <code class=\"doc-inline-code\">clamp(15px, 1.4cqi + 8px, 22px)<\u002Fcode> — fluid typography от ширины контейнера.\n        Включается через prop <code class=\"doc-inline-code\">format: \"compact\"<\u002Fcode>.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 class=\"doc-h4\">Смешанные длины label у позиций<\u002Fh4>\n    <div class=\"doc-card\">\n      <div id=\"ex-content-mixed-len\"><\u002Fdiv>\n      <div class=\"doc-card-note\">Колонка label обрезается по доступной ширине, не растягиваясь под самый длинный лейбл. Числовые колонки всегда выровнены по правому краю.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 7.7 a11y -->\n    <h3 class=\"doc-h3\" id=\"s77\"><span class=\"doc-h3-num\">7.7<\u002Fspan>Accessibility при ограниченных размерах<\u002Fh3>\n    <ul class=\"doc-p\" style=\"padding-left: 20px;\">\n      <li>Скрытые через <code class=\"doc-inline-code\">overflow<\u002Fcode> элементы доступны screen reader — используется <code class=\"doc-inline-code\">visibility: hidden<\u002Fcode> или <code class=\"doc-inline-code\">aria-hidden=\"false\"<\u002Fcode>; <strong>не<\u002Fstrong> <code class=\"doc-inline-code\">display: none<\u002Fcode> для строк под fade-градиентом<\u002Fli>\n      <li>Триггер сворачивания/разворачивания имеет <code class=\"doc-inline-code\">aria-expanded<\u002Fcode> и <code class=\"doc-inline-code\">aria-controls<\u002Fcode><\u002Fli>\n      <li>Прогресс-бар имеет <code class=\"doc-inline-code\">role=\"img\"<\u002Fcode> и <code class=\"doc-inline-code\">aria-label<\u002Fcode> с текстовой сводкой всех позиций<\u002Fli>\n      <li>Tooltip при hover дублируется при focus — клавиатурный доступ обязателен<\u002Fli>\n      <li>Touch-таргеты («Показать ещё», иконка expand) — минимум 44×44px даже в самом узком контейнере<\u002Fli>\n      <li>Сегменты бара не являются интерактивными элементами по умолчанию — это decorative graphics; для интерактивности оборачивайте в <code class=\"doc-inline-code\">&lt;button&gt;<\u002Fcode><\u002Fli>\n    <\u002Ful>\n\n    <!-- ============== INTERACTIVE DEMO ============== -->\n    <h3 class=\"doc-h3\" id=\"s-demo\"><span class=\"doc-h3-num\">★<\u002Fspan>Интерактивный демо<\u002Fh3>\n    <p class=\"doc-p\">\n      Двигайте ползунок ширины — или потяните за правый край контейнера —\n      чтобы увидеть, как компонент проходит брейкпоинты в реальном времени.\n    <\u002Fp>\n\n    <div class=\"demo-resize\">\n      <div class=\"demo-resize-controls\">\n        <label>width <input id=\"demo-range\" type=\"range\" min=\"120\" max=\"800\" value=\"560\" step=\"1\"><\u002Flabel>\n        <label><input id=\"demo-num\" type=\"number\" min=\"120\" max=\"800\" value=\"560\"> px<\u002Flabel>\n        <label>items <select id=\"demo-count\">\n          <option value=\"1\">1<\u002Foption>\n          <option value=\"2\">2<\u002Foption>\n          <option value=\"3\" selected=\"\">3<\u002Foption>\n          <option value=\"5\">5<\u002Foption>\n          <option value=\"8\">8<\u002Foption>\n        <\u002Fselect><\u002Flabel>\n        <label style=\"display: flex; gap: 6px; align-items: center; font-family: var(--doc-mono);\">\n          <input id=\"demo-partial\" type=\"checkbox\"> partial (неучтено)\n        <\u002Flabel>\n        <label style=\"display: flex; gap: 6px; align-items: center; font-family: var(--doc-mono);\">\n          <input id=\"demo-height-on\" type=\"checkbox\"> ограничить высоту\n        <\u002Flabel>\n        <label>height <input id=\"demo-height-range\" type=\"range\" min=\"48\" max=\"500\" value=\"200\" step=\"1\" disabled=\"\"><\u002Flabel>\n        <label><input id=\"demo-height-num\" type=\"number\" min=\"48\" max=\"500\" value=\"200\" disabled=\"\"> px<\u002Flabel>\n        <label>при переполнении <select id=\"demo-overflow-mode\" disabled=\"\">\n          <option value=\"fade\">fade + «ещё N»<\u002Foption>\n          <option value=\"scroll\">скролл внутри<\u002Foption>\n          <option value=\"expand\">кнопка «развернуть»<\u002Foption>\n        <\u002Fselect><\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"demo-resize-stage\">\n        <div class=\"demo-resize-frame sbw-stretch\" id=\"demo-frame\" data-width=\"560\" style=\"width: 560px;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 8. ЧИСЛА И ТИПОГРАФИКА ============== -->\n    <h2 class=\"doc-h2\" id=\"s8\"><span class=\"doc-h2-num\">08<\u002Fspan>Числовой формат и типографика<\u002Fh2>\n\n    <h4 class=\"doc-h4\">Числа<\u002Fh4>\n    <ul class=\"doc-p\" style=\"padding-left: 20px;\">\n      <li>Разделитель тысяч — неразрывный пробел (<code class=\"doc-inline-code\">U+00A0<\u002Fcode>): <code>1 279<\u002Fcode><\u002Fli>\n      <li>Десятичный разделитель — запятая: <code>511,60<\u002Fcode><\u002Fli>\n      <li>Проценты — всегда 2 знака после запятой: <code>35,00%<\u002Fcode><\u002Fli>\n      <li>Total — без дробной части (округление до целого), если total &lt; 1 — два знака<\u002Fli>\n      <li>Все цифры — <code class=\"doc-inline-code\">font-variant-numeric: tabular-nums<\u002Fcode><\u002Fli>\n      <li>Локаль: <code class=\"doc-inline-code\">ru-RU<\u002Fcode> через <code class=\"doc-inline-code\">Intl.NumberFormat<\u002Fcode><\u002Fli>\n    <\u002Ful>\n\n    <h4 class=\"doc-h4\">Типографика<\u002Fh4>\n    <div class=\"doc-table-wrap\">\n      <table class=\"doc-table\">\n        <thead><tr><th>Элемент<\u002Fth><th>Размер<\u002Fth><th>Вес<\u002Fth><th>Цвет<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>label<\u002Ftd><td>13px<\u002Ftd><td>400<\u002Ftd><td><code>#54596A<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td>sublabel<\u002Ftd><td>11px<\u002Ftd><td>400<\u002Ftd><td><code>#8A8F9E<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td>total<\u002Ftd><td>18px → 22px (fluid)<\u002Ftd><td>700<\u002Ftd><td><code>#1B1D24<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td>unit<\u002Ftd><td>12px<\u002Ftd><td>400<\u002Ftd><td><code>#8A8F9E<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td>row label<\u002Ftd><td>14px → 13px<\u002Ftd><td>400<\u002Ftd><td><code>#1B1D24<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td>row percent<\u002Ftd><td>14px → 13px<\u002Ftd><td>400<\u002Ftd><td><code>#54596A<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td>row value<\u002Ftd><td>14px → 13px<\u002Ftd><td>400<\u002Ftd><td><code>#1B1D24<\u002Fcode><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 9. КОРНЕР-КЕЙСЫ ============== -->\n    <h2 class=\"doc-h2\" id=\"s9\"><span class=\"doc-h2-num\">09<\u002Fspan>Корнер-кейсы<\u002Fh2>\n\n    <div class=\"doc-grid doc-grid-2\">\n\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Контейнер 0px при старте<\u002Fdiv><div class=\"doc-card-meta\">контейнер: 0 → ResizeObserver<\u002Fdiv><\u002Fdiv>\n        <div style=\"width: 220px; margin: 0 auto;\">\n          <div id=\"ex-corner-zero\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"doc-card-note\">Компонент рендерит skeleton с <code>visibility: hidden<\u002Fcode>; ResizeObserver сработает на первом ненулевом ресайзе и нормально пересчитает сегменты бара.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Total = 0, items не пусты<\u002Fdiv><div class=\"doc-card-meta\">total: 0 · values &gt; 0<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-corner-zero-total\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Если values ненулевые — partial/overflow в зависимости от суммы percent. <strong>Если все values = 0 — автоматически empty state<\u002Fstrong> (это эквивалент отсутствия данных).<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Total отрицательное<\u002Fdiv><div class=\"doc-card-meta\">total: −500<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-corner-negative\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Допустимо. Бар не рендерится, проценты показываются. В подвале — поясняющий текст.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">item.percent есть, item.value — нет<\u002Fdiv><div class=\"doc-card-meta\">status: \"error\"<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-corner-bad-data\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Считается ошибкой данных — компонент уходит в <code>error<\u002Fcode>.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Дубликаты id у позиций<\u002Fdiv><div class=\"doc-card-meta\">console.warn<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-corner-dupes\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Компонент рендерится с предупреждением в <code>console.warn<\u002Fcode>. Hover-связь работает только для первого вхождения.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"doc-card\">\n        <div class=\"doc-card-header\"><div class=\"doc-card-title\">Очень много позиций (50+)<\u002Fdiv><div class=\"doc-card-meta\">items: 50 · maxVisibleItems: 5<\u002Fdiv><\u002Fdiv>\n        <div id=\"ex-corner-many\"><\u002Fdiv>\n        <div class=\"doc-card-note\">Список сокращается до maxVisibleItems, остальные — «Показать ещё N». В баре всё равно отрисовываются все сегменты (с учётом min-width 2px) — это намеренно: даёт визуальный «отпечаток» распределения.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div class=\"doc-callout doc-callout-info\" style=\"margin-top: 16px;\">\n      <span class=\"doc-callout-icon\">i<\u002Fspan>\n      <div><strong>Анимированный фон родителя.<\u002Fstrong> ResizeObserver реагирует на изменения ширины — может вызвать частые пересчёты. Решение: пересчёт через <code class=\"doc-inline-code\">requestAnimationFrame<\u002Fcode> с дебаунсом 16ms. Визуально это никак не проявляется — техническое замечание для разработчика.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 10. JSON ============== -->\n    <h2 class=\"doc-h2\" id=\"s10\"><span class=\"doc-h2-num\">10<\u002Fspan>JSON-структура данных<\u002Fh2>\n<pre class=\"doc-pre\"><span class=\"tk-com\">// Минимальный пример<\u002Fspan>\n{\n  <span class=\"tk-key\">\"label\"<\u002Fspan>: <span class=\"tk-str\">\"ВБС по сделке на 25.02.2026, млн. руб.\"<\u002Fspan>,\n  <span class=\"tk-key\">\"sublabel\"<\u002Fspan>: <span class=\"tk-str\">\"25.02.2026\"<\u002Fspan>,\n  <span class=\"tk-key\">\"unit\"<\u002Fspan>: <span class=\"tk-str\">\"млн. руб.\"<\u002Fspan>,\n  <span class=\"tk-key\">\"total\"<\u002Fspan>: <span class=\"tk-num\">1279<\u002Fspan>,\n  <span class=\"tk-key\">\"status\"<\u002Fspan>: <span class=\"tk-str\">\"loaded\"<\u002Fspan>,\n  <span class=\"tk-key\">\"showPercent\"<\u002Fspan>: <span class=\"tk-num\">true<\u002Fspan>,\n  <span class=\"tk-key\">\"showProgressBar\"<\u002Fspan>: <span class=\"tk-num\">true<\u002Fspan>,\n  <span class=\"tk-key\">\"maxVisibleItems\"<\u002Fspan>: <span class=\"tk-num\">5<\u002Fspan>,\n  <span class=\"tk-key\">\"items\"<\u002Fspan>: [\n    {\n      <span class=\"tk-key\">\"id\"<\u002Fspan>: <span class=\"tk-str\">\"kr\"<\u002Fspan>,\n      <span class=\"tk-key\">\"label\"<\u002Fspan>: <span class=\"tk-str\">\"Кредит\"<\u002Fspan>,\n      <span class=\"tk-key\">\"value\"<\u002Fspan>: <span class=\"tk-num\">511.60<\u002Fspan>,\n      <span class=\"tk-key\">\"percent\"<\u002Fspan>: <span class=\"tk-num\">35<\u002Fspan>,\n      <span class=\"tk-key\">\"color\"<\u002Fspan>: <span class=\"tk-num\">null<\u002Fspan>\n    },\n    {\n      <span class=\"tk-key\">\"id\"<\u002Fspan>: <span class=\"tk-str\">\"ak\"<\u002Fspan>,\n      <span class=\"tk-key\">\"label\"<\u002Fspan>: <span class=\"tk-str\">\"Акции\"<\u002Fspan>,\n      <span class=\"tk-key\">\"value\"<\u002Fspan>: <span class=\"tk-num\">511.60<\u002Fspan>,\n      <span class=\"tk-key\">\"percent\"<\u002Fspan>: <span class=\"tk-num\">35<\u002Fspan>,\n      <span class=\"tk-key\">\"color\"<\u002Fspan>: <span class=\"tk-num\">null<\u002Fspan>\n    }\n  ]\n}<\u002Fpre>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 11. CHECKLIST ============== -->\n    <h2 class=\"doc-h2\" id=\"s11\"><span class=\"doc-h2-num\">11<\u002Fspan>Checklist для разработчика<\u002Fh2>\n\n    <ul class=\"doc-checklist\">\n      <li><div>Компонент использует <strong>Container Queries<\u002Fstrong>, не Media Queries<\u002Fdiv><\u002Fli>\n      <li><div><strong>ResizeObserver<\u002Fstrong> подключён для динамического ресайза сегментов бара<\u002Fdiv><\u002Fli>\n      <li><div>При ширине &lt; 320px проценты скрываются <strong>автоматически<\u002Fstrong><\u002Fdiv><\u002Fli>\n      <li><div>При overflow контейнера по высоте — появляется fade + «Ещё N»<\u002Fdiv><\u002Fli>\n      <li><div><code>total<\u002Fcode> никогда не обрезается и не скрывается<\u002Fdiv><\u002Fli>\n      <li><div>Прогресс-бар пересчитывает сегменты <strong>после<\u002Fstrong> того как контейнер стал видим<\u002Fdiv><\u002Fli>\n      <li><div>Все скрытые элементы (под fade, в свёрнутом списке) доступны через screen reader<\u002Fdiv><\u002Fli>\n      <li><div>Числа форматируются через <code>Intl.NumberFormat('ru-RU')<\u002Fcode>, не вручную<\u002Fdiv><\u002Fli>\n      <li><div>Цвета берутся из палитры по индексу; 9-я позиция и далее → «Прочее»<\u002Fdiv><\u002Fli>\n      <li><div>Минимальная ширина сегмента бара — 2px (через ResizeObserver-постпроцессинг)<\u002Fdiv><\u002Fli>\n      <li><div>Состояния loading / error / empty имеют отдельные визуальные ветки, не overlay поверх loaded<\u002Fdiv><\u002Fli>\n      <li><div>Hover на сегменте бара или строке — двунаправленная связка через <code>opacity<\u002Fcode><\u002Fdiv><\u002Fli>\n      <li><div>Touch-таргеты ≥ 44×44px (включая «Показать ещё» и expand-триггер)<\u002Fdiv><\u002Fli>\n      <li><div>Локаль форматирования передаётся как prop, дефолт — <code>ru-RU<\u002Fcode><\u002Fdiv><\u002Fli>\n    <\u002Ful>\n\n    <hr class=\"doc-rule\">\n\n    <!-- ============== 12. OUT OF SCOPE ============== -->\n    <h2 class=\"doc-h2\" id=\"s12\"><span class=\"doc-h2-num\">12<\u002Fspan>Что намеренно НЕ входит в компонент<\u002Fh2>\n    <p class=\"doc-p\">\n      Чтобы оставаться универсальным и простым, компонент не делает следующее.\n      Если вашему сценарию это нужно — оборачивайте Summary Breakdown в композитный\n      компонент уровня вашей продуктовой команды, не модифицируйте сам виджет.\n    <\u002Fp>\n\n    <div class=\"doc-table-wrap\">\n      <table class=\"doc-table\">\n        <thead><tr><th>Не входит<\u002Fth><th>Где это сделать<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Drill-down (клик по позиции открывает детализацию)<\u002Ftd><td>Оборачивающий компонент — навешивает onClick на строки<\u002Ftd><\u002Ftr>\n          <tr><td>Редактирование значений inline<\u002Ftd><td>Отдельный edit-mode компонент; этот — read-only<\u002Ftd><\u002Ftr>\n          <tr><td>Экспорт (CSV/XLSX/PDF)<\u002Ftd><td>Action-bar родительской карточки<\u002Ftd><\u002Ftr>\n          <tr><td>Сортировка пользователем<\u002Ftd><td>Передавайте уже отсортированный массив в <code>items[]<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td>Фильтрация позиций<\u002Ftd><td>На уровне источника данных<\u002Ftd><\u002Ftr>\n          <tr><td>Сравнение нескольких периодов (delta)<\u002Ftd><td>Используйте отдельный компонент Trend / Delta Indicator<\u002Ftd><\u002Ftr>\n          <tr><td>Drag-and-drop порядок позиций<\u002Ftd><td>Не предусмотрено — компонент read-only<\u002Ftd><\u002Ftr>\n          <tr><td>Анимация при изменении значений (counter rolling)<\u002Ftd><td>Не предусмотрено по умолчанию — может добавляться как opt-in prop<\u002Ftd><\u002Ftr>\n          <tr><td>Локализация дат, валют<\u002Ftd><td>Передавайте уже отформатированные <code>label<\u002Fcode>, <code>sublabel<\u002Fcode>, <code>unit<\u002Fcode><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <hr class=\"doc-rule\" style=\"margin-bottom: 32px;\">\n\n    <footer style=\"color: var(--doc-fg-faint); font-size: 12px; margin-top: 24px;\">\n      <div>Summary Breakdown · v1.0 · Generic data-viz component<\u002Fdiv>\n      <div>Design System internal documentation · Russian locale<\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script src=\"84441e67-4e60-4807-abd2-2512922ef4c2\"><\u002Fscript>\n<script src=\"707ae27d-89d6-4be2-827c-f5d8885d0775\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
